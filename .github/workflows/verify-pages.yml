name: Verify Hikam website publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check generated site and installable assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the published HTML and hashed service worker are current
        run: python src/build.py --check
      - name: Validate links, manifest, meta tags, and 34 dossiers
        run: python src/tests/verify_publication.py
      - name: Validate book structure and chapter navigation
        run: python src/tests/validate_structure.py
      - name: Validate accessible contents and print controls
        run: python src/tests/verify_sidebar.py
      - name: Verify dual reading progress, saved place, and print exclusion
        run: python src/tests/verify_reading_progress.py
      - name: Verify full-book search, tabs, and mobile layout contracts
        run: python src/tests/verify_reader_search_tabs.py
      - name: Verify persistent on-screen revision visibility
        run: python src/tests/verify_revision_visibility.py
      - name: Verify complete search indexing and revision preference safety
        run: python src/tests/verify_search_integrity.py
      - name: Verify mobile interaction and accessibility contract
        run: python src/tests/verify_mobile_interaction.py
      - name: Verify Phase 3 brand, sidebar expansion and obsolete code removal
        run: python src/tests/verify_visual_polish.py
      - name: Test offline worker's cache lifecycle
        run: node src/tests/test_offline_cache.mjs
      - name: Regression — optional offline assets must not block reader
        run: node src/tests/test_optional_precache.mjs


  browser:
    name: Playwright reading, print and PWA regressions
    needs: verify
    # Pinned because Playwright 1.57 does not support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact revision being tested
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible Playwright and PDF inspection tools
        run: python -m pip install playwright==1.57.0 pypdf==5.9.0
      - name: Install pinned Chromium browser
        # GitHub's Ubuntu 24.04 hosted image includes Chromium's runtime libs.
        run: python -m playwright install chromium
      - name: Test full-book search, responsive layout, preferences, keyboard and PDF
        run: python src/tests/browser_quality.py
      - name: Batch 2 permalink and altered-edition checkpoint browser coverage
        run: python src/tests/browser_batch2_continuity.py
      - name: Test real offline installation, edition upgrades and failed updates
        run: python src/tests/browser_pwa_updates.py
      - name: Upload screenshots and sampled print PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikam-browser-regressions-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  batch2-generate:
    name: Temporary Batch 2 publication regeneration
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/batch2-continuity-20261106'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministically regenerate publication
        run: python src/build.py
      - name: Commit regenerated outputs on the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'build(batch2): regenerate deterministic publication'
            git push origin HEAD:${{ github.head_ref }}
          fi
