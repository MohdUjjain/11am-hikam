name: Temporary rebuild of Hikam generated reader
on:
  push:
    branches:
      - fix/search-hidden-revisions-and-passage-navigation-20261106
    paths:
      - .github/workflows/rebuild-branch-temp.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Regenerate from authored modular book
        run: python src/build.py
      - name: Commit generated outputs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Hikam published reader after search corrections"
            git push
          fi
